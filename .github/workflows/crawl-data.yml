name: Crawl Finance Data

on:
  schedule:
    # Singapore 08:00 = UTC 00:00
    - cron: "0 0 * * *"

  workflow_dispatch:
    inputs:
      target:
        description: "Crawler target to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - prices
          - news
          - reports
          - link_companies

jobs:
  crawl-data:
    runs-on: ubuntu-latest

    env:
      APP_ENV: production
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "$POSTGRES_HOST" ]; then
            echo "POSTGRES_HOST secret is missing."
            exit 1
          fi

          if [ -z "$POSTGRES_DB" ]; then
            echo "POSTGRES_DB secret is missing."
            exit 1
          fi

          if [ -z "$POSTGRES_USER" ]; then
            echo "POSTGRES_USER secret is missing."
            exit 1
          fi

          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "POSTGRES_PASSWORD secret is missing."
            exit 1
          fi

          echo "Database target:"
          echo "host=$POSTGRES_HOST"
          echo "port=$POSTGRES_PORT"
          echo "db=$POSTGRES_DB"
          echo "user=$POSTGRES_USER"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run selected crawler
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.target != 'all'
        run: |
          python -m app.cli.crawl --target "${{ github.event.inputs.target }}"

      - name: Run full daily crawl
        if: github.event_name == 'schedule' || github.event.inputs.target == 'all'
        run: |
          python -m app.cli.crawl --target prices
          python -m app.cli.crawl --target news
          python -m app.cli.crawl --target reports
          python -m app.cli.crawl --target link_companies