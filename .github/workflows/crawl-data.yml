name: Crawl Finance Data

on:
  schedule:
    # Singapore 08:00 = UTC 00:00
    - cron: "0 0 * * *"

  workflow_dispatch:
    inputs:
      target:
        description: "Crawler target to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - prices
          - news
          - reports
          - link_companies

jobs:
  crawl-data:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is missing."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run selected crawler
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.target != 'all'
        run: |
          python -m app.cli.crawl --target "${{ github.event.inputs.target }}"

      - name: Run full daily crawl
        if: github.event_name == 'schedule' || github.event.inputs.target == 'all'
        run: |
          python -m app.cli.crawl --target prices
          python -m app.cli.crawl --target news
          python -m app.cli.crawl --target reports
          python -m app.cli.crawl --target link_companies